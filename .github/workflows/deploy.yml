name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_API_MODEL: ${{ secrets.API_MODEL }}
        run: npm run build

      - name: Deploy
        run: npx gh-pages -d dist